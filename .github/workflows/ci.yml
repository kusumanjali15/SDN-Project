# Runs on every push and pull request. A change that only works on one
# person's machine fails here and must not be merged.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ml.lock

      - name: Install locked ML packages (TensorFlow skipped to keep CI fast)
        run: |
          grep -v '^tensorflow' requirements-ml.lock > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt

      - name: Shell scripts parse
        run: for f in scripts/*.sh test_attacks.sh; do bash -n "$f"; done

      - name: No Windows line endings in scripts
        run: |
          if grep -rlI $'\r' --include=*.sh --include=*.py .; then
            echo "Files above have CRLF line endings"; exit 1
          fi

      - name: Environment check (paths, versions, config, models)
        run: ./scripts/check_env.sh --ml

      - name: ML and controller tests
        run: python -m pytest -q ml/tests controller/tests
